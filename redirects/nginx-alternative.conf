# Alternative to cloudflare-worker.js for teams self-hosting the built
# MkDocs site (e.g. behind an internal nginx ingress) instead of GitHub
# Pages + Cloudflare. Same four alert-type suffixes, expressed as regex
# rewrites since nginx has no first-class string-suffix matching.
#
# Include inside the `server { }` block serving the built `site/` directory.

# ErrorBudgetBurnFast / ErrorBudgetBurnSlow: fixed suffixes.
location ~ ^/(?<service_type>[a-z]+)/[A-Za-z0-9]+ErrorBudgetBurnFast$ {
    return 301 /runbooks/$service_type/error-budget-burn-fast/;
}
location ~ ^/(?<service_type>[a-z]+)/[A-Za-z0-9]+ErrorBudgetBurnSlow$ {
    return 301 /runbooks/$service_type/error-budget-burn-slow/;
}

# LatencySLOViolation{5m,1h,6h}
location ~ ^/(?<service_type>[a-z]+)/[A-Za-z0-9]+LatencySLOViolation(5m|1h|6h)$ {
    return 301 /runbooks/$service_type/latency-slo-violation/;
}

# SaturationHigh<Metric> -- metric name varies (CpuUtilizationRatio,
# MemoryUtilizationRatio, ...), so this is intentionally the loosest match;
# keep it LAST so the more specific rules above take precedence.
location ~ ^/(?<service_type>[a-z]+)/[A-Za-z0-9]+SaturationHigh[A-Za-z0-9]+$ {
    return 301 /runbooks/$service_type/saturation-high/;
}
