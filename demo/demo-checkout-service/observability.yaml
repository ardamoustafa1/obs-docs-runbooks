apiVersion: obs.acme.com/v2
kind: ServiceObservability
metadata:
  name: demo-checkout-service
spec:
  serviceType: http
  environment: dev
  slo:
    availability_target: 0.999
    latency_target_ms: 300
    latency_percentile: 99
  goldenSignals:
    trafficMetric: http_server_requests_total
    errorMetric: http_server_request_errors_total
    latencyMetric: http_server_request_duration_seconds
    saturationMetrics:
      - cpu_utilization_ratio
      - memory_utilization_ratio
  dashboards:
    template: http-service-v2
  alerting:
    burnRateAlerts: true
    extraRules: []
  ownership:
    team: team-demo
    slackChannel: "#demo-checkout-alerts"
    pagerDutyService: demo-checkout-gameday
